name: Assign media IDs

on:
  push:
    branches: [master]
    paths: ['_data/media.json']

permissions:
  contents: write
  pages: write

jobs:
  assign-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: node scripts/add-media-ids.js

      # Pushes made with GITHUB_TOKEN don't trigger the Pages build, so request it explicitly
      - name: Commit new IDs and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No new IDs needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Assign IDs to new media entries"
          git pull --rebase
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
