<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>CMS - Lucas Dasso</title>
  </head>
  <body>
    <!-- Decap CMS App -->
    <script src="https://unpkg.com/decap-cms@^2.10.0/dist/decap-cms.js"></script>
    
    <script>
      // Configure CMS
      CMS.init({
        config: {
          backend: {
            name: 'local'
          },
          media_folder: 'assets/uploads',
          public_folder: '/assets/uploads',
          collections: [
            {
              name: 'pages',
              label: 'Páginas',
              folder: '_pages',
              format: 'frontmatter',
              create: true,
              fields: [
                {
                  name: 'layout',
                  label: 'Layout',
                  widget: 'hidden',
                  default: 'base'
                },
                {
                  name: 'title',
                  label: 'Título',
                  widget: 'string'
                },
                {
                  name: 'permalink',
                  label: 'Permanente',
                  widget: 'string'
                },
                {
                  name: 'description',
                  label: 'Descripción',
                  widget: 'text',
                  required: false
                },
                {
                  name: 'body',
                  label: 'Contenido',
                  widget: 'markdown'
                }
              ]
            },
            {
              name: 'posts',
              label: 'Posts',
              folder: '_posts',
              format: 'frontmatter',
              create: true,
              slug: '{{year}}-{{month}}-{{day}}-{{slug}}',
              fields: [
                {
                  name: 'layout',
                  label: 'Layout',
                  widget: 'hidden',
                  default: 'post'
                },
                {
                  name: 'title',
                  label: 'Título',
                  widget: 'string'
                },
                {
                  name: 'author',
                  label: 'Autor',
                  widget: 'string',
                  default: 'Lucas Dasso'
                },
                {
                  name: 'date',
                  label: 'Fecha',
                  widget: 'datetime'
                },
                {
                  name: 'categories',
                  label: 'Categorías',
                  widget: 'list',
                  required: false
                },
                {
                  name: 'tags',
                  label: 'Etiquetas',
                  widget: 'list',
                  required: false
                },
                {
                  name: 'image',
                  label: 'Imagen destacada',
                  widget: 'image',
                  required: false
                },
                {
                  name: 'description',
                  label: 'Descripción',
                  widget: 'text',
                  required: false
                },
                {
                  name: 'body',
                  label: 'Contenido',
                  widget: 'markdown'
                }
              ]
            }
          ]
        }
      });
    </script>

    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      }
    </style>
  </body>
</html>
