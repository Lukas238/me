<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sveltia CMS</title>
    <script defer src="https://cdn.jsdelivr.net/npm/sveltia-cms/dist/index.js"></script>
    <script>
      // Sveltia CMS configuration
      window.CMS_CONFIG = {
        backend: {
          name: 'local'
        },
        i18n: {
          structure: 'single_file',
          locales: ['es'],
          default_locale: 'es'
        },
        media_folder: 'assets/uploads',
        public_folder: '/assets/uploads',
        collections: [
          {
            name: 'pages',
            label: 'Páginas',
            folder: '_pages',
            format: 'frontmatter',
            create: true,
            fields: [
              {
                name: 'layout',
                label: 'Layout',
                widget: 'hidden',
                default: 'base'
              },
              {
                name: 'title',
                label: 'Título',
                widget: 'string'
              },
              {
                name: 'permalink',
                label: 'Permanente',
                widget: 'string'
              },
              {
                name: 'description',
                label: 'Descripción',
                widget: 'text',
                required: false
              },
              {
                name: 'body',
                label: 'Contenido',
                widget: 'markdown'
              }
            ]
          },
          {
            name: 'posts',
            label: 'Posts',
            folder: '_posts',
            format: 'frontmatter',
            create: true,
            slug: '{{year}}-{{month}}-{{day}}-{{slug}}',
            preview_path: '{{year}}/{{month}}/{{day}}/{{slug}}',
            fields: [
              {
                name: 'layout',
                label: 'Layout',
                widget: 'hidden',
                default: 'post'
              },
              {
                name: 'title',
                label: 'Título',
                widget: 'string'
              },
              {
                name: 'author',
                label: 'Autor',
                widget: 'string',
                default: 'Lucas Dasso'
              },
              {
                name: 'date',
                label: 'Fecha',
                widget: 'datetime',
                format: 'YYYY-MM-DD HH:mm:ss'
              },
              {
                name: 'categories',
                label: 'Categorías',
                widget: 'list',
                required: false
              },
              {
                name: 'tags',
                label: 'Etiquetas',
                widget: 'list',
                required: false
              },
              {
                name: 'image',
                label: 'Imagen destacada',
                widget: 'image',
                required: false
              },
              {
                name: 'description',
                label: 'Descripción',
                widget: 'text',
                required: false
              },
              {
                name: 'body',
                label: 'Contenido',
                widget: 'markdown'
              }
            ]
          }
        ]
      };
    </script>
  </head>
  <body>
  </body>
</html>
