backend:
  name: local

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: pages
    label: Páginas
    folder: _pages
    format: frontmatter
    create: true
    fields:
      - name: layout
        label: Layout
        widget: hidden
        default: base
      - name: title
        label: Título
        widget: string
      - name: permalink
        label: Permanente
        widget: string
      - name: description
        label: Descripción
        widget: text
        required: false
      - name: body
        label: Contenido
        widget: markdown

  - name: posts
    label: Posts
    folder: _posts
    format: frontmatter
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{year}}/{{month}}/{{day}}/{{slug}}"
    fields:
      - name: layout
        label: Layout
        widget: hidden
        default: post
      - name: title
        label: Título
        widget: string
      - name: author
        label: Autor
        widget: string
        default: Lucas Dasso
      - name: date
        label: Fecha
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss"
      - name: categories
        label: Categorías
        widget: list
        required: false
      - name: tags
        label: Etiquetas
        widget: list
        required: false
      - name: image
        label: Imagen destacada
        widget: image
        required: false
      - name: description
        label: Descripción
        widget: text
        required: false
      - name: body
        label: Contenido
        widget: markdown
