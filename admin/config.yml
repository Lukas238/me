backend:
  name: github
  repo: Lukas238/me
  branch: main

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  # PÁGINAS ESTÁTICAS
  - name: pages
    label: 📄 Páginas
    folder: _pages
    format: frontmatter
    create: true
    fields:
      - name: layout
        label: Layout
        widget: hidden
        default: base
      - name: title
        label: Título
        widget: string
      - name: permalink
        label: Permanente
        widget: string
      - name: description
        label: Descripción
        widget: text
        required: false
      - name: body
        label: Contenido
        widget: markdown

  # POSTS DE BLOG
  - name: posts
    label: 📝 Posts
    folder: _posts
    format: frontmatter
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog/{{year}}/{{month}}/{{day}}/{{slug}}"
    fields:
      - name: layout
        label: Layout
        widget: hidden
        default: post
      - name: title
        label: Título
        widget: string
      - name: author
        label: Autor
        widget: string
        default: Lucas Dasso
      - name: date
        label: Fecha de publicación
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss"
      - name: categories
        label: Categorías
        widget: list
        required: false
      - name: tags
        label: Etiquetas
        widget: list
        required: false
      - name: image
        label: Imagen destacada
        widget: image
        required: false
      - name: description
        label: Descripción corta
        widget: text
        required: false
      - name: body
        label: Contenido
        widget: markdown

  # WISHLIST
  - name: wishlist
    label: 🎁 Wishlist
    folder: _data/wishlist
    format: json
    create: true
    slug: "{{date_added}}-{{title}}"
    fields:
      - name: date_added
        label: Fecha agregada
        widget: datetime
        type: date
      - name: title
        label: Título del producto
        widget: string
      - name: image_url
        label: URL de la imagen
        widget: string
        required: false
      - name: product_url
        label: URL del producto
        widget: string
        required: false
      - name: tags
        label: Etiquetas
        widget: list
        required: false
      - name: notes
        label: Notas
        widget: text
        required: false

  # PELÍCULAS
  - name: movies
    label: 🎬 Películas
    folder: _data/media
    format: json
    create: true
    slug: "{{title}}-{{year}}"
    summary_fields:
      - label: Poster
        field: tmdb_poster_url
      - label: Título
        field: title
      - label: Año
        field: year
    summary: "{{title}} ({{year}})"
    fields:
      - name: id
        label: ID
        widget: hidden
      - name: type
        label: Tipo de contenido
        widget: select
        options:
          - movie
          - series
          - documentary
      - name: title
        label: Título
        widget: string
      - name: year
        label: Año
        widget: number
        value_type: int/string
      - name: rating
        label: Clasificación
        widget: select
        options:
          - 0+
          - 7+
          - 13+
          - 16+
          - 18+
      - name: watched
        label: ¿Visto?
        widget: boolean
        default: false
      - name: status
        label: Estado
        widget: text
        required: false
      - name: tags
        label: Géneros/Etiquetas
        widget: list
        required: false
      - name: tmdb_id
        label: ID de TMDB
        widget: string
        required: false
      - name: tmdb_poster_url
        label: URL del póster (TMDB)
        widget: image
        media_folder: ""
        public_folder: https://image.tmdb.org/t/p/w200
        required: false

  # BIDASSOA
  - name: bidassoa
    label: 🖼️ Bidassoa
    folder: _data/bidassoa
    format: json
    create: true
    fields:
      - name: id
        label: ID
        widget: hidden
      - name: title
        label: Título
        widget: string
      - name: year
        label: Año
        widget: number
        value_type: int/string
      - name: artist
        label: Artista
        widget: string
        required: false
      - name: description
        label: Descripción
        widget: text
        required: false
      - name: tags
        label: Etiquetas
        widget: list
        required: false

  # CONFIGURACIÓN DEL SITIO
  - name: site_config
    label: ⚙️ Configuración
    files:
      - name: config
        label: Configuración principal
        file: _config.yml
        format: yaml
        fields:
          - name: title
            label: Título del sitio
            widget: string
          - name: baseurl
            label: Base URL
            widget: string
          - name: url
            label: URL del sitio
            widget: string
          - name: google_analytics
            label: Google Analytics ID
            widget: string
            required: false


