app_title: Be thou the Gear in the Builder's Plan — Admin Access

logo:
  src: /assets/img/logo_login.jpg
  alt: Be thou the Gear in the Builder's Plan — Admin Access
  show_in_header: true

backend:
  name: github
  repo: Lukas238/me
  branch: main
  base_url: https://me-cms-auth.dassolucas.workers.dev

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

media_folder: /assets/uploads
public_folder: /assets/uploads

media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048
        svg:
          optimize: true

collections:
  # PÁGINAS ESTÁTICAS
  - name: pages
    label: 📄 Páginas
    folder: _pages
    format: frontmatter
    create: true
    fields:
      - name: layout
        label: Layout
        widget: hidden
        default: base
      - name: title
        label: Título
        widget: string
      - name: permalink
        label: Permanente
        widget: string
      - name: description
        label: Descripción
        widget: text
        required: false
      - name: body
        label: Contenido
        widget: markdown

  # HOME PAGE
  - name: home
    label: 🏠 Home
    files:
      - name: home
        label: Home
        file: index.md
        format: frontmatter
        fields:
          - name: layout
            label: Layout
            widget: hidden
            default: about
          - name: body
            label: Contenido
            widget: markdown

  - divider: true

  # POSTS DE BLOG
  - name: posts
    label: 📝 Blog
    label_singular: Post
    folder: _posts
    format: frontmatter
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog/{{year}}/{{month}}/{{day}}/{{title | slugify}}.html"
    fields:
      - name: layout
        label: Layout
        widget: hidden
        default: post
      - name: title
        label: Título
        widget: string
      - name: author
        label: Autor
        widget: string
        default: Lucas Dasso
      - name: date
        label: Fecha de publicación
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss"
      - name: categories
        label: Categorías
        widget: relation
        collection: categories
        multiple: true
        search_fields: [title]
        display_fields: [title]
        value_field: "{{slug}}"
        required: false
      - name: tags
        label: Etiquetas
        widget: relation
        collection: tags
        multiple: true
        search_fields: [title]
        display_fields: [title]
        value_field: "{{slug}}"
        required: false
      - name: image
        label: Imagen destacada
        widget: image
        required: false
      - name: description
        label: Descripción corta
        widget: text
        required: false
      - { name: legacy, label: Legacy, widget: hidden, required: false }
      - { name: legacy_id, label: Legacy ID, widget: hidden, required: false }
      - { name: legacy_path, label: Legacy path, widget: hidden, required: false }
      - { name: redirect_from, label: Redirect from, widget: hidden, required: false }
      - name: body
        label: Contenido
        widget: markdown

  - divider: true

  # CATEGORÍAS Y ETIQUETAS DEL BLOG (se eligen o crean desde el post)
  - name: categories
    label: 🗂️ Categorías
    label_singular: Categoría
    folder: _data/categories
    extension: yml
    format: yaml
    create: true
    fields:
      - { name: title, label: Nombre, widget: string }

  - name: tags
    label: 🏷️ Etiquetas
    label_singular: Etiqueta
    folder: _data/tags
    extension: yml
    format: yaml
    create: true
    fields:
      - { name: title, label: Nombre, widget: string }

  # WISHLIST
  - name: wishlist
    label: 🎁 Wishlist
    folder: _data/wishlist
    format: json
    create: true
    thumbnail: cover
    slug: "{{date_added}}-{{title}}"
    fields:
      - name: date_added
        label: Fecha agregada
        widget: datetime
        type: date
      - name: title
        label: Título del producto
        widget: string
      - name: cover
        label: Imagen
        widget: image
        required: false
      - name: product_url
        label: URL del producto
        widget: string
        required: false
      - name: tags
        label: Etiquetas
        widget: list
        required: false
      - name: notes
        label: Notas
        widget: text
        required: false

  # PELÍCULAS Y SERIES
  - name: movies
    label: 🎬 Media Collection
    folder: _data/media
    format: json
    create: true
    thumbnail: cover
    slug: "{{title}}-{{year}}"
    summary: "{{title}} ({{year}})"
    sortable_fields:
      fields: [title, year]
      default:
        field: year
        direction: descending
    view_filters:
      - label: Películas
        field: type
        pattern: '^movie$'
      - label: Series
        field: type
        pattern: '^series$'
    fields:
      - name: id
        label: ID
        widget: hidden
      - name: type
        label: Tipo de contenido
        widget: select
        options:
          - movie
          - series
        default: movie
      - name: title
        label: Título
        widget: string
        required: true
      - name: title_es
        label: Título en español
        widget: string
        required: false
      - name: year
        label: Año
        widget: number
        value_type: int/string
        required: true
      - name: rating
        label: Clasificación
        widget: select
        options:
          - 0+
          - 7+
          - 13+
          - 16+
          - 18+
        required: false
      - name: watched
        label: ¿Visto?
        widget: boolean
        default: false
        required: false
      - name: favorite
        label: ⭐ Favorito
        widget: boolean
        default: false
        required: false
      - name: tags
        label: Géneros/Etiquetas
        widget: list
        required: false
      - name: tmdb_id
        label: ID de TMDB (se completa automáticamente)
        widget: string
        required: false
      - name: cover
        label: Póster (se completa automáticamente)
        widget: image
        required: false

  # BIDASSOA
  - name: bidassoa
    label: 🖼️ Bidassoa
    folder: _data/bidassoa
    format: json
    create: true
    media_folder: /assets/bidassoa
    public_folder: /assets/bidassoa
    thumbnail: cover
    summary: "{{title | alias}} ({{year}})"
    sortable_fields: [year]
    filterable_fields: [year]
    fields:
      - name: id
        label: ID
        widget: hidden
      - name: title
        label: Título
        widget: string
        required: false
      - name: alias
        label: Alias
        widget: string
        required: false
      - name: year
        label: Año
        widget: number
        value_type: int/string
      - name: cover
        label: Portada (primera imagen)
        widget: image
        required: false
      - name: images
        label: Imágenes (galería)
        widget: list
        field:
          name: image
          widget: image
        required: false
      - name: width
        label: Ancho (px)
        widget: number
        value_type: int
        required: false
      - name: height
        label: Alto (px)
        widget: number
        value_type: int
        required: false
      - name: keywords
        label: Palabras clave
        widget: list
        required: false
      - name: notes
        label: Notas
        widget: text
        required: false
      - name: added
        label: Fecha agregada
        widget: datetime
        type: date
        required: false

  # BACKGROUNDS
  - name: backgrounds
    label: 🌅 Backgrounds
    file: _data/backgrounds.json
    format: json
    thumbnail: image
    summary: "{{fields.image}} ({{fields.year}})"
    sortable_fields: [year]
    filterable_fields: [year]
    fields:
      - name: image
        label: Imagen
        widget: image
        media_folder: /assets/backgrounds
        public_folder: /assets/backgrounds
      - name: year
        label: Año
        widget: number
        value_type: int/string

  # CONFIGURACIÓN DEL SITIO
  - name: site_config
    label: ⚙️ Configuración
    files:
      - name: config
        label: Configuración principal
        file: _config.yml
        format: yaml
        fields:
          - name: title
            label: Título del sitio
            widget: string
          - name: baseurl
            label: Base URL
            widget: string
          - name: url
            label: URL del sitio
            widget: string
          - name: google_analytics
            label: Google Analytics ID
            widget: string
            required: false
