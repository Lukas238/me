---
layout: blog_section
title: Tags
permalink: /blog/tags/
---

{% assign tags = site.tags | sort %}
{% for tag in tags %}
  <section class="blog-group" id="{{ tag[0] | slugify }}">
    <h2>{{ tag[0] }} <small class="text-body-secondary">({{ tag[1].size }})</small></h2>
    <ul class="list-unstyled">
      {% for post in tag[1] %}
        <li><time class="text-body-secondary" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time> <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></li>
      {% endfor %}
    </ul>
  </section>
{% endfor %}
